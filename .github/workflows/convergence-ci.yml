name: convergence-ci

on:
  pull_request:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexra
          POSTGRES_PASSWORD: nexra
          POSTGRES_DB: nexra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexra -d nexra_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://nexra:nexra@localhost:5432/nexra_test
      REDIS_URL: redis://localhost:6379/1
      OPENAI_API_KEY: test-openai-key
      STRIPE_SECRET_KEY: test-stripe-key
      STRIPE_WEBHOOK_SECRET: test-webhook-secret
      STRIPE_DELEGATION_METER_ID: meter_test
      SECRET_KEY_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry
      - name: Install Python dependencies
        run: |
          cd nexra
          poetry install --no-interaction
      - name: Migration forward/rollback smoke
        run: |
          cd nexra
          poetry run alembic upgrade head
          poetry run alembic downgrade -1
          poetry run alembic upgrade head
      - name: Ruff lint
        run: |
          cd nexra
          poetry run ruff check \
            --select F,E9 \
            services/budget_service.py \
            services/delegation_service.py \
            services/hitl_service.py \
            services/siem_service.py \
            api/routers/siem.py \
            api/routers/policies.py
      - name: Mypy type check
        run: |
          cd nexra
          poetry run mypy \
            services/notification_service.py \
            services/hitl_service.py \
            services/anomaly_service.py \
            services/budget_service.py
          poetry run mypy \
            --ignore-missing-imports \
            --allow-untyped-defs \
            --disable-error-code assignment \
            --disable-error-code type-arg \
            --disable-error-code no-untyped-def \
            --disable-error-code import-untyped \
            services/budget_service.py \
            services/delegation_service.py \
            services/hitl_service.py \
            services/siem_service.py \
            api/routers/siem.py \
            api/routers/policies.py
      - name: OpenAPI snapshot contract gate
        run: |
          cd nexra
          poetry run python ../scripts/check_openapi_snapshot.py
      - name: OpenAPI snapshot freshness guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          cd nexra
          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-parse HEAD~1)"
          fi
          poetry run python ../scripts/check_openapi_snapshot_freshness.py --base "$BASE_SHA"
      - name: Run unit tests
        run: |
          cd nexra
          poetry run pytest -q tests/unit
      - name: Run contract tests
        run: |
          cd nexra
          poetry run pytest -q tests/contracts
      - name: Run integration tests
        run: |
          cd nexra
          poetry run pytest -q tests/integration
      - name: Run e2e tests
        run: |
          cd nexra
          poetry run pytest -q tests/e2e
      - name: Run performance tests
        run: |
          cd nexra
          poetry run pytest -q tests/performance
      - name: Run live infra performance tests (opt-in)
        if: ${{ vars.NEXRA_RUN_LIVE_PERF == '1' }}
        run: |
          cd nexra
          NEXRA_RUN_LIVE_PERF=1 poetry run pytest -q tests/performance/test_live_infra_perf.py

  ts-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            nexra/internal-dashboard/package-lock.json
            nexra/sdk/nexra-ts/package-lock.json
      - name: Dashboard install
        run: npm --prefix nexra/internal-dashboard ci
      - name: Dashboard typecheck
        run: cd nexra/internal-dashboard && npx tsc -b --pretty false
      - name: Dashboard build
        run: npm --prefix nexra/internal-dashboard run build
      - name: TS SDK install
        run: npm --prefix nexra/sdk/nexra-ts ci
      - name: TS SDK build
        run: npm --prefix nexra/sdk/nexra-ts run build
      - name: TS SDK package smoke
        run: |
          cd nexra/sdk/nexra-ts
          npm pack --dry-run --json >/tmp/nexra-ts-pack.json
          cat /tmp/nexra-ts-pack.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          const raw = fs.readFileSync('/tmp/nexra-ts-pack.json', 'utf8');
          const packMeta = JSON.parse(raw);
          if (!Array.isArray(packMeta) || packMeta.length === 0 || !Array.isArray(packMeta[0]?.files)) {
            console.error('Unexpected npm pack --json output shape');
            process.exit(1);
          }

          const packedPaths = new Set(packMeta[0].files.map((entry) => entry.path));
          const requiredPaths = ['README.md', 'LICENSE', 'dist/index.js', 'dist/index.d.ts'];
          const missingPaths = requiredPaths.filter((path) => !packedPaths.has(path));
          if (missingPaths.length > 0) {
            console.error('TS SDK package smoke failed. Missing files:', missingPaths.join(', '));
            process.exit(1);
          }

          console.log('TS SDK package smoke passed. Required files present:', requiredPaths.join(', '));
          EOF
